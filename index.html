<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Somnus: Before the Blackout</title><style>*{box-sizing:border-box}body{margin:0;background:#080909;color:#ddd;font:14px monospace;display:grid;place-items:center;min-height:100vh}#frame{width:min(100vw,177.78vh);aspect-ratio:16/9;position:relative}canvas{width:100%;height:100%;display:block;cursor:crosshair}#help{position:absolute;bottom:5px;left:8px;font-size:10px;color:#aaa;pointer-events:none}</style></head><body><div id="frame"><canvas id="game" width="1280" height="720"></canvas><div id="help">CLICK HOTSPOTS · SPACE MONITOR · A/D DOORS · W/S LOOK · SURVIVE UNTIL 6 AM</div></div><script>

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function box(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}function label(s,x,y,size=18,color='#ddd',align='left'){c.fillStyle=color;c.font=`${size}px monospace`;c.textAlign=align;c.fillText(s,x,y)}function stroke(x,y,x2,y2,color='#555',width=2){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke()}function noise(n=500){for(let i=0;i<n;i++)box(Math.random()*W,Math.random()*H,2,1,`rgba(230,220,190,${Math.random()*.09})`)}

 c.rotate(-.16);c.fillStyle='#171716';c.beginPath();c.moveTo(-35,220);c.lineTo(-2,25);c.lineTo(45,-25);c.lineTo(73,-112);c.lineTo(91,-105);c.lineTo(80,-45);c.lineTo(112,-114);c.lineTo(130,-105);c.lineTo(104,-29);c.lineTo(147,-80);c.lineTo(164,-67);c.lineTo(122,8);c.lineTo(94,57);c.lineTo(74,220);c.closePath();c.fill();c.strokeStyle='#514838';c.lineWidth=8;c.stroke();c.restore();return}
let fur=id===1?'#51483c':id===2?'#383044':id===3?'#a7a092':'#4a4030';c.strokeStyle='#282725';c.lineWidth=23;c.lineCap='round';c.beginPath();c.moveTo(-30,20);c.lineTo(-82,100);c.lineTo(-105,150);c.moveTo(30,20);c.lineTo(82,100);c.lineTo(105,150);c.moveTo(-25,90);c.lineTo(-34,165);c.moveTo(25,90);c.lineTo(34,165);c.stroke();if(id===3){c.rotate(Math.PI);c.translate(0,-55)}c.fillStyle=fur;c.beginPath();c.ellipse(0,45,52,80,0,0,7);c.fill();if(id===4){for(let i=0;i<5;i++)box(-22+i*10,10,5,45,'#c27c37')}c.beginPath();c.ellipse(0,-50,55,47,0,0,7);c.fill();c.fillStyle='#121313';c.beginPath();c.ellipse(-30,-88,20,23,0,0,7);c.ellipse(30,-88,20,23,0,0,7);c.fill();c.fillStyle=id===2?'#b4ce70':'#dfa253';c.shadowColor=c.fillStyle;c.shadowBlur=15;c.beginPath();c.ellipse(-20,-52,8,10,0,0,7);c.ellipse(20,-52,8,10,0,0,7);c.fill();c.shadowBlur=0;c.restore()}
function office(){background();hallway(55,435);hallway(790,435,true);box(496,100,288,490,'#121515');box(510,116,260,450,'#282924');for(let i=0;i<6;i++)box(531+i*39,130,16,430,'#48463d');box(0,600,W,120,'#171818');box(135,553,1010,104,'#292720');box(101,650,1080,35,'#171615');box(565,459,175,40,'#171b1b');box(580,466,144,26,'#070a0b');box(604,475,98,4,'#51726b');if(IsBlackout){box(0,0,W,H,'rgba(0,0,0,.78)');box(38,560,1204,6,'#ad591e')}else{if(IsWestDoorClosed)drawDoor(80,150,175,425);if(IsEastDoorClosed)drawDoor(1025,150,175,425)}if(IsLookingUp)rafters()}

function button(x,y,w,h,s,on=false){box(x,y,w,h,on?'#9b6338':'#3e403a');box(x+3,y+3,w-6,h-6,on?'#bd7843':'#777365');label(s,x+w/2,y+h/2+6,14,'#f1e7cc','center')}
function monitor(){box(0,0,W,H,'rgba(0,0,0,.85)');cam(ActiveCamID);box(0,0,W,55,'rgba(0,0,0,.75)');label(`SECURITY NETWORK // CAM 0${ActiveCamID}`,35,37,21,'#c7d4be');box(935,470,320,210,'rgba(8,12,11,.94)');label('FACILITY MAP',1095,495,13,'#c3c0a9','center');stroke(980,540,1190,540,'#a89f7c',12);stroke(1090,540,1090,630,'#a89f7c',12);for(let i=1;i<=4;i++)button(960+(i-1)*69,i===3?560:520,57,32,`CAM ${i}`,ActiveCamID===i);if(ActiveCamID===3)button(450,610,380,60,'HOLD: CALIBRATE GENERATOR');if(ActiveCamID===4)button(470,610,340,60,'VENT LOCK / DETERRENT PULSE');label('CLICK TO LOWER MONITOR',640,704,12,'#ccc','center')}
function hud(){box(18,15,300,100,'rgba(0,0,0,.65)');label(`POWER: ${Math.ceil(PowerLevel)}%`,34,44,18,PowerLevel<25?'#dc5c42':'#ddd');label('USAGE',35,75,12);for(let i=0;i<5;i++)box(100+i*31,62,25,17,i<PowerUsage?(i<2?'#7bab63':i<4?'#d6a542':'#d9543e'):'#30332e');label(`GEN STABILITY: ${Math.ceil(GeneratorStability)}%`,35,103,12);box(1020,15,240,78,'rgba(0,0,0,.65)');label(`${CurrentHour===0?12:CurrentHour}:00 AM`,1140,48,24,'#e7dfc7','center');label(`SHIFT ${ShiftNumber}`,1140,77,14,'#b1a88e','center');label(`GUARDIANS ACTIVE: ${ShiftNumber===1?'NONE':ShiftNumber===2?'TICK-TOCK':ShiftNumber===3?'TICK-TOCK / KILOWATT':ShiftNumber===4?'TICK-TOCK / KILOWATT / SLUMBER':'ALL FOUR + THE ARCHITECT'}`,640,25,14,'#ded4bd','center')}
function officeButtons(){if(IsLookingUp){button(1080,610,150,55,IsShutterClosed?'OPEN SHUTTER':'CLOSE SHUTTER',IsShutterClosed);button(25,620,130,50,'DOWN')}else{button(25,320,125,55,IsWestDoorClosed?'WEST OPEN':'WEST CLOSE',IsWestDoorClosed);button(1130,320,125,55,IsEastDoorClosed?'EAST OPEN':'EAST CLOSE',IsEastDoorClosed);button(573,120,134,48,'LOOK UP');button(475,670,330,42,'SECURITY MONITOR')}}
function draw(){if(scene===2){box(0,0,W,H,'#070808');label('SIGNAL LOST',640,230,22,'#827b69','center');label('GAME OVER',640,350,62,'#c8b99a','center');if(ActiveJumpscare===5){entity(640,450,0,2,true);label('THE ARCHITECT',640,620,16,'#666','center')}label('CLICK TO RESTART',640,690,14,'#aaa','center');return}if(scene===1){box(0,0,W,H,'#030404');label('6:00 AM',640,290,58,'#eee4c9','center');label('SHIFT COMPLETE',640,350,27,'#c7b389','center');label(`SHIFT ${ShiftNumber} CLEARED`,640,396,17,'#898474','center');return}if(IsCameraOpen)monitor();else{office();officeButtons();noise(350)}hud();if(ArchitectSignal){let pulse=(Math.sin(performance.now()/1000*2*Math.PI*4.85)+1)/2;box(0,0,W,H,`rgba(153,181,137,${.04+pulse*.08})`);label('SIGNAL INTERFERENCE // 4.85 Hz',640,160,20,`rgba(230,235,204,${.4+pulse*.5})`,'center');label('GROUND THE SIGNAL: OPEN CAM 3',640,190,14,'#d7caa8','center')}if(ActiveJumpscare){jumpTimer+=dt;if(ActiveJumpscare===5){box(0,0,W,H,'#090909');entity(640,455,0,jumpTimer<.2?1.2:2.5,true)}else{box(0,0,W,H,'#111');entity(640,400,ActiveJumpscare,jumpTimer<.12?.8:jumpTimer<.2?1.2:2.5);if(jumpTimer>.2)label('IT FOUND YOU',640,620,32,'#c98459','center')}if(jumpTimer>.9){scene=2;IsGameOver=true}}}
function resetShift(){CurrentHour=0;HourTimer=0;PowerLevel=100;IsBlackout=false;GeneratorStability=100;IsCameraOpen=false;ActiveCamID=1;IsLookingUp=false;IsWestDoorClosed=false;IsEastDoorClosed=false;IsShutterClosed=false;TickTockPos=0;SlumberPos=0;PorcelainPos=0;KilowattAggression=0;ArchitectActive=ShiftNumber>=5;ArchitectSignal=false;ArchitectTimer=16;ArchitectAttack=0;ActiveJumpscare=0;IsGameOver=false;moveTimer=westTimer=blockedTimer=porcelainTimer=slumberTimer=blackoutTimer=jumpTimer=0;scene=0}
function update(delta){dt=delta;if(scene!==0||ActiveJumpscare)return;if(scene===0){HourTimer+=dt;if(HourTimer>=75){HourTimer-=75;CurrentHour++;if(CurrentHour>=6){scene=1;setTimeout(()=>{ShiftNumber=Math.min(5,ShiftNumber+1);resetShift()},4000);return}}
const tickEnabled=ShiftNumber>=2,kiloEnabled=ShiftNumber>=3,slumberEnabled=ShiftNumber>=4,porcelainEnabled=ShiftNumber>=5;
PowerUsage=1+(IsCameraOpen?1:0)+(IsWestDoorClosed?1:0)+(IsEastDoorClosed?1:0)+(IsShutterClosed?1:0)+(kiloEnabled&&KilowattAggression>=55?1:0);PowerLevel=clamp(PowerLevel-.15*PowerUsage*dt,0,100);
if(kiloEnabled){GeneratorStability=clamp(GeneratorStability-1.5*dt,0,100);KilowattAggression=clamp((100-GeneratorStability)*1.15,0,100);if(GeneratorStability<=0){IsBlackout=true;PowerLevel=0;ActiveJumpscare=4;return}}
moveTimer+=dt;if(moveTimer>=Math.max(1.7,5-(ShiftNumber-1)*.48)){moveTimer=0;if(tickEnabled&&Math.random()<.13+ShiftNumber*.03&&TickTockPos<2)TickTockPos++;if(slumberEnabled&&Math.random()<.12+ShiftNumber*.025&&SlumberPos<3)SlumberPos++;if(porcelainEnabled&&Math.random()<.1+ShiftNumber*.025&&PorcelainPos<2)PorcelainPos++}
if(tickEnabled&&TickTockPos===2){if(IsWestDoorClosed){blockedTimer+=dt;if(blockedTimer>4.5){TickTockPos=0;blockedTimer=westTimer=0}}else if((westTimer+=dt)>=5)ActiveJumpscare=1}else{westTimer=0;blockedTimer=0}if(slumberEnabled&&SlumberPos===3)ActiveJumpscare=2;
if(porcelainEnabled&&PorcelainPos===2){if(IsShutterClosed){if((porcelainTimer+=dt)>1.8){PorcelainPos=0;porcelainTimer=0}}else if((porcelainTimer+=dt)>=6)ActiveJumpscare=3}else porcelainTimer=0;
if(PowerLevel<=0&&!IsBlackout){IsBlackout=true;IsCameraOpen=false;IsWestDoorClosed=false;IsEastDoorClosed=false;IsShutterClosed=false;blackoutTimer=5+Math.random()*7}if(IsBlackout){blackoutTimer-=dt;if(blackoutTimer<=0)ActiveJumpscare=Math.random()<.5?1:4}
if(ArchitectActive){ArchitectTimer-=dt;if(!ArchitectSignal&&ArchitectTimer<=0){ArchitectSignal=true;ArchitectAttack=0;ArchitectTimer=16+Math.random()*10}if(ArchitectSignal){ArchitectAttack+=dt;if(IsCameraOpen&&ActiveCamID===3){ArchitectSignal=false;ArchitectAttack=0;ArchitectTimer=22+Math.random()*12}else if(ArchitectAttack>=8){ActiveJumpscare=5}}}}
function click(mx,my){if(scene===1)return;if(scene===2){ShiftNumber=1;resetShift();return}if(ActiveJumpscare)return;if(IsCameraOpen){if(my>680){IsCameraOpen=false;return}if(mx>935&&my>470&&my<680){for(let i=1;i<=4;i++){let x=960+(i-1)*69;if(mx>=x&&mx<=x+57&&my>=(i===3?560:520)&&my<=(i===3?592:552)){ActiveCamID=i;return}}}if(ActiveCamID===4&&mx>=470&&mx<=810&&my>=610&&my<=670){deterrentTimer=.4;if(SlumberPos===2)SlumberPos=0;return}if(my<60)IsCameraOpen=false}else if(IsLookingUp){if(mx>1080&&my>610){IsShutterClosed=!IsShutterClosed;return}if(mx<155&&my>620)IsLookingUp=false}else{if(mx<150&&my>320&&my<375){IsWestDoorClosed=!IsWestDoorClosed;return}if(mx>1130&&my>320&&my<375){IsEastDoorClosed=!IsEastDoorClosed;return}if(mx>573&&mx<707&&my>120&&my<168){IsLookingUp=true;return}if(mx>475&&mx<805&&my>660){IsCameraOpen=true;return}}}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(IsCameraOpen&&ActiveCamID===3&&x>=450&&x<=830&&y>=610&&y<=670){calibrateHeld=true;click(x,y);return}click(x,y)});window.addEventListener('pointerup',()=>calibrateHeld=false);window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();IsCameraOpen=!IsCameraOpen}if(e.key==='a'||e.key==='A')IsWestDoorClosed=!IsWestDoorClosed;if(e.key==='d'||e.key==='D')IsEastDoorClosed=!IsEastDoorClosed;if(e.key==='w'||e.key==='W')IsLookingUp=true;if(e.key==='s'||e.key==='S')IsLookingUp=false;if(e.key>='1'&&e.key<='4'&&IsCameraOpen)ActiveCamID=Number(e.key);if(e.key==='Escape')IsCameraOpen=false});
function loop(now){dt=Math.min(.05,(now-last)/1000);last=now;if(scene===0&&!ActiveJumpscare){update(dt);if(calibrateHeld&&IsCameraOpen&&ActiveCamID===3&&ShiftNumber>=3)GeneratorStability=clamp(GeneratorStability+30*dt,0,100)}draw();requestAnimationFrame(loop)}resetShift();requestAnimationFrame(loop);
